{% extends "library/base_library.html" %}

{% block library_content %}
<div class="row justify-content-center my-4">
  <div class="col-md-6 col-lg-5">
    <div class="card lib-card p-4 shadow-sm border-danger">
      <div class="text-center mb-4">
        <div class="text-danger fs-1 mb-2"><i class="fas fa-shield-alt"></i></div>
        <h4 class="fw-bold text-dark mb-1">Staff / Librarian Desk Login</h4>
        <p class="text-muted small">Sign in to manage requests, issues, returns, and inventory</p>
      </div>

      <form method="post" action="">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Staff Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="fas fa-user-shield"></i></span>
            <input type="text" name="identifier" class="form-control" placeholder="Staff Username" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-dark">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="fas fa-key"></i></span>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mb-3" style="background-color: #E61013 !important; border-color: #E61013 !important; color: #ffffff !important; font-size: 16px; border-radius: 6px;">
          <i class="fas fa-desktop me-2"></i> Access Circulation Desk
        </button>

        <div class="text-center small text-muted">
          Staff authentication requires librarian profile or admin credentials.
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
